<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nilesh Vishwa — Links</title>
<meta name="description" content="Nilesh Vishwa — UI/UX & Graphic Designer. Portfolio, socials, and contact links." />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0b10;
    --bg-1:#0d0f18;
    --violet:#7c5cff;
    --cyan:#00c2d1;
    --coral:#ff5c7a;
    --text-hi:#f1f0f6;
    --text-lo:#9a98ae;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--bg-0);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:64px 20px;
  }

  /* ambient drifting gradient blobs — the "smoothness" layer */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .blob-a{
    width:520px;height:520px;
    background:var(--violet);
    top:-160px; left:-120px;
    animation:drift-a 22s ease-in-out infinite;
  }
  .blob-b{
    width:460px;height:460px;
    background:var(--cyan);
    bottom:-180px; right:-140px;
    animation:drift-b 26s ease-in-out infinite;
  }
  .blob-c{
    width:360px;height:360px;
    background:var(--coral);
    bottom:20%; left:-160px;
    opacity:0.22;
    animation:drift-c 30s ease-in-out infinite;
  }

  @keyframes drift-a{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(60px,80px) scale(1.1);}
  }
  @keyframes drift-b{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-70px,-50px) scale(1.08);}
  }
  @keyframes drift-c{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,-60px) scale(1.15);}
  }

  /* faint circuit grid overlay */
  .grid-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black 40%, transparent 90%);
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    transform:translateY(18px);
    animation:rise 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes rise{
    to{opacity:1; transform:translateY(0);}
  }

  /* hexagon avatar frame with rotating circuit ring — signature element */
  .avatar-wrap{
    position:relative;
    width:132px;height:132px;
    margin-bottom:26px;
  }
  .hex{
    width:100%;height:100%;
    clip-path:polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background:linear-gradient(150deg, var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .hex img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1.5px dashed rgba(124,92,255,0.45);
    animation:spin 16s linear infinite;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }

  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:0.22em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--text-lo);
    margin-bottom:10px;
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    margin:0 0 8px;
    background:linear-gradient(90deg, #ffffff, var(--cyan) 70%, var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    color:var(--text-lo);
    font-size:14.5px;
    line-height:1.55;
    max-width:340px;
    margin:0 0 34px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:14px 18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:14px;
    backdrop-filter:blur(14px);
    text-decoration:none;
    color:var(--text-hi);
    overflow:hidden;
    opacity:0;
    transform:translateY(14px);
    animation:rise 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .link-btn::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:linear-gradient(180deg, var(--violet), var(--cyan));
    opacity:0;
    transition:opacity 0.25s ease;
  }

  .link-btn:hover{
    transform:translateY(-3px);
    border-color:rgba(124,92,255,0.5);
    background:rgba(255,255,255,0.07);
  }
  .link-btn:hover::before{ opacity:1; }

  .link-icon{
    width:20px;height:20px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan);
  }
  .link-icon svg{width:100%;height:100%;}

  .link-label{
    font-weight:500;
    font-size:15px;
    flex:1;
    text-align:left;
  }

  .link-tag{
    font-family:'Space Grotesk',sans-serif;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-lo);
  }

  footer{
    margin-top:38px;
    font-size:12px;
    color:var(--text-lo);
    letter-spacing:0.05em;
    opacity:0;
    animation:rise 0.6s ease forwards;
    animation-delay:0.9s;
  }
  footer span{color:var(--violet);}

  @media (max-width:480px){
    h1{font-size:26px;}
  }

  /* rising bubbles */
  .bubbles{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bubble{
    position:absolute;
    bottom:-10%;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(124,92,255,0.05) 70%);
    border:1px solid rgba(255,255,255,0.12);
    animation:rise-bubble linear infinite;
  }
  @keyframes rise-bubble{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.55; }
    92%{ opacity:0.3; }
    100%{ transform:translateY(-115vh) translateX(var(--drift, 30px)); opacity:0; }
  }

  /* drifting glow lights */
  .lights{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .light{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    animation:float-light ease-in-out infinite;
  }
  @keyframes float-light{
    0%,100%{ transform:translate(0,0); opacity:0.25; }
    50%{ transform:translate(var(--lx, 24px), var(--ly, -30px)); opacity:0.75; }
  }

  @media (prefers-reduced-motion: reduce){
    .blob, .ring, .card, .link-btn, footer{ animation:none !important; opacity:1 !important; transform:none !important; }
    .bubble, .light{ display:none; }
    .cursor-dot, .cursor-ring{ display:none !important; }
  }

  /* custom cursor */
  .cursor-dot, .cursor-ring{
    position:fixed;
    top:0; left:0;
    pointer-events:none;
    border-radius:50%;
    z-index:999;
    will-change:transform;
    transform:translate(-50%,-50%);
  }
  .cursor-dot{
    width:7px;height:7px;
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan), 0 0 20px rgba(0,194,209,0.5);
  }
  .cursor-ring{
    width:34px;height:34px;
    border:1.5px solid rgba(124,92,255,0.55);
    background:radial-gradient(circle, rgba(124,92,255,0.08), transparent 70%);
    transition:width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .cursor-ring.is-active{
    width:52px;height:52px;
    border-color:rgba(0,194,209,0.7);
    background:radial-gradient(circle, rgba(0,194,209,0.12), transparent 70%);
  }

  @media (hover:none){
    .cursor-dot, .cursor-ring{ display:none; }
  }
  @media (hover:hover) and (pointer:fine){
    body{ cursor:none; }
    a, button{ cursor:none; }
  }
</style>
</head>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  // --- rising bubbles ---
  var bubbleContainer = document.getElementById('bubbles');
  var bubbleCount = window.innerWidth < 600 ? 10 : 18;

  for (var i = 0; i < bubbleCount; i++) {
    var b = document.createElement('div');
    b.className = 'bubble';
    var size = 6 + Math.random() * 34;
    var left = Math.random() * 100;
    var duration = 14 + Math.random() * 18;
    var delay = Math.random() * -30;
    var drift = (Math.random() * 80 - 40) + 'px';

    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = left + 'vw';
    b.style.setProperty('--drift', drift);
    b.style.animationDuration = duration + 's';
    b.style.animationDelay = delay + 's';

    bubbleContainer.appendChild(b);
  }

  // --- drifting glow lights ---
  var lightContainer = document.getElementById('lights');
  var lightColors = ['#7c5cff', '#00c2d1', '#ff5c7a'];
  var lightCount = window.innerWidth < 600 ? 8 : 14;

  for (var j = 0; j < lightCount; j++) {
    var l = document.createElement('div');
    l.className = 'light';
    var lsize = 3 + Math.random() * 6;
    var color = lightColors[j % lightColors.length];
    var top = Math.random() * 100;
    var lleft = Math.random() * 100;
    var lduration = 6 + Math.random() * 8;
    var ldelay = Math.random() * -10;
    var lx = (Math.random() * 60 - 30) + 'px';
    var ly = (Math.random() * 60 - 30) + 'px';

    l.style.width = lsize + 'px';
    l.style.height = lsize + 'px';
    l.style.top = top + 'vh';
    l.style.left = lleft + 'vw';
    l.style.background = color;
    l.style.boxShadow = '0 0 ' + (lsize * 2.5) + 'px ' + color;
    l.style.setProperty('--lx', lx);
    l.style.setProperty('--ly', ly);
    l.style.animationDuration = lduration + 's';
    l.style.animationDelay = ldelay + 's';

    lightContainer.appendChild(l);
  }

  // --- custom cursor with smooth trailing motion ---
  var isFinePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if (isFinePointer) {
    var dot = document.getElementById('cursorDot');
    var ringEl = document.getElementById('cursorRing');

    var mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    var dotX = mouseX, dotY = mouseY;
    var ringX = mouseX, ringY = mouseY;

    window.addEventListener('mousemove', function(e){
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.querySelectorAll('a, button').forEach(function(el){
      el.addEventListener('mouseenter', function(){ ringEl.classList.add('is-active'); });
      el.addEventListener('mouseleave', function(){ ringEl.classList.remove('is-active'); });
    });

    function animateCursor(){
      // dot tracks quickly, ring trails with spring-like easing
      dotX += (mouseX - dotX) * 0.55;
      dotY += (mouseY - dotY) * 0.55;
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;

      dot.style.transform = 'translate(' + dotX + 'px,' + dotY + 'px) translate(-50%,-50%)';
      ringEl.style.transform = 'translate(' + ringX + 'px,' + ringY + 'px) translate(-50%,-50%)';

      requestAnimationFrame(animateCursor);
    }
    requestAnimationFrame(animateCursor);

    document.addEventListener('mouseleave', function(){
      dot.style.opacity = '0';
      ringEl.style.opacity = '0';
    });
    document.addEventListener('mouseenter', function(){
      dot.style.opacity = '1';
      ringEl.style.opacity = '1';
    });
  }
})();
</script>

</body>
</html>
